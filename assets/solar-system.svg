<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Sri Naren — 3D Animated Developer Solar System</title>
<desc id="desc">A 3D-shaded dark space illustration with a glowing central sun, tilted orbital paths, moving planets, twinkling stars, and a shooting star representing software engineering interests.</desc>
<defs>
  <radialGradient id="space" cx="50%" cy="48%" r="72%">
    <stop offset="0%" stop-color="#132a47"/>
    <stop offset="52%" stop-color="#081324"/>
    <stop offset="100%" stop-color="#02060e"/>
  </radialGradient>
  <radialGradient id="nebulaA" cx="25%" cy="30%" r="45%">
    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebulaB" cx="78%" cy="68%" r="45%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>

  <!-- 3D Sun -->
  <radialGradient id="sun" cx="38%" cy="34%" r="65%">
    <stop offset="0%" stop-color="#fffce0"/>
    <stop offset="28%" stop-color="#ffe07d"/>
    <stop offset="65%" stop-color="#ff8c38"/>
    <stop offset="92%" stop-color="#d9481c"/>
    <stop offset="100%" stop-color="#8f2408"/>
  </radialGradient>
  <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffb347" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#ff7b29" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ff7b29" stop-opacity="0"/>
  </radialGradient>

  <!-- 3D Shaded Planet Gradients (off-center specular highlight + terminator shadow) -->
  <radialGradient id="pJava" cx="32%" cy="28%" r="70%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="28%" stop-color="#cbd5e1"/>
    <stop offset="70%" stop-color="#64748b"/>
    <stop offset="100%" stop-color="#1e293b"/>
  </radialGradient>
  <radialGradient id="pPython" cx="30%" cy="26%" r="72%">
    <stop offset="0%" stop-color="#e9ffd9"/>
    <stop offset="30%" stop-color="#5cd685"/>
    <stop offset="72%" stop-color="#1b7a52"/>
    <stop offset="100%" stop-color="#0a2e22"/>
  </radialGradient>
  <radialGradient id="pAI" cx="30%" cy="26%" r="72%">
    <stop offset="0%" stop-color="#e0f7ff"/>
    <stop offset="30%" stop-color="#48b8f0"/>
    <stop offset="70%" stop-color="#1d56b8"/>
    <stop offset="100%" stop-color="#091d4a"/>
  </radialGradient>
  <radialGradient id="pReact" cx="32%" cy="28%" r="70%">
    <stop offset="0%" stop-color="#ffe7d6"/>
    <stop offset="30%" stop-color="#ef7f56"/>
    <stop offset="72%" stop-color="#9e3328"/>
    <stop offset="100%" stop-color="#3b100e"/>
  </radialGradient>
  <radialGradient id="pProjects" cx="30%" cy="26%" r="72%">
    <stop offset="0%" stop-color="#f5e6ff"/>
    <stop offset="32%" stop-color="#a57ef2"/>
    <stop offset="72%" stop-color="#533294"/>
    <stop offset="100%" stop-color="#1e103d"/>
  </radialGradient>
  <radialGradient id="pCloud" cx="30%" cy="26%" r="72%">
    <stop offset="0%" stop-color="#fff1d0"/>
    <stop offset="32%" stop-color="#d9ab6c"/>
    <stop offset="72%" stop-color="#8c5e2b"/>
    <stop offset="100%" stop-color="#36200b"/>
  </radialGradient>

  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e2d4ff" stop-opacity="0.15"/>
    <stop offset="35%" stop-color="#d8b4fe" stop-opacity="0.85"/>
    <stop offset="65%" stop-color="#f3e8ff" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15"/>
  </linearGradient>

  <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
    <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
  </linearGradient>

  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="planetGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Elliptical 3D Orbit Paths centered at (600, 250) -->
  <path id="orbit1" d="M 465,250 A 135,50 0 1,0 735,250 A 135,50 0 1,0 465,250"/>
  <path id="orbit2" d="M 395,250 A 205,76 0 1,0 805,250 A 205,76 0 1,0 395,250"/>
  <path id="orbit3" d="M 315,250 A 285,106 0 1,0 885,250 A 285,106 0 1,0 315,250"/>
  <path id="orbit4" d="M 235,250 A 365,136 0 1,0 965,250 A 365,136 0 1,0 235,250"/>
  <path id="orbit5" d="M 155,250 A 445,166 0 1,0 1045,250 A 445,166 0 1,0 155,250"/>
  <path id="orbit6" d="M 75,250 A 525,196 0 1,0 1125,250 A 525,196 0 1,0 75,250"/>
  <path id="cometPath" d="M -80,115 Q 520,25 1280,195"/>
</defs>

<!-- Deep Space Backdrop -->
<rect width="1200" height="520" rx="24" fill="url(#space)"/>
<rect width="1200" height="520" rx="24" fill="url(#nebulaA)"/>
<rect width="1200" height="520" rx="24" fill="url(#nebulaB)"/>

<!-- Twinkling Starfield -->
<g fill="#ffffff">
  <circle cx="65" cy="72" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="145" cy="155" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="225" cy="48" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="112" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.0s" repeatCount="indefinite"/></circle>
  <circle cx="445" cy="40" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="575" cy="86" r="1.0" opacity="0.5"/>
  <circle cx="695" cy="36" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="815" cy="118" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
  <circle cx="935" cy="54" r="1.1" opacity="0.6"/>
  <circle cx="1090" cy="108" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="1145" cy="212" r="1.1" opacity="0.6"/>
  <circle cx="88" cy="340" r="1.3" opacity="0.7"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="4.7s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="442" r="1.1" opacity="0.5"/>
  <circle cx="340" cy="390" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="472" r="1.0" opacity="0.5"/>
  <circle cx="715" cy="434" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="855" cy="480" r="1.1" opacity="0.5"/>
  <circle cx="1020" cy="392" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="1140" cy="450" r="1.1" opacity="0.6"/>
</g>

<!-- Shooting Star / Comet -->
<g opacity="0.85">
  <path d="M-48,0 L0,0" stroke="url(#cometTail)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="2.6" fill="#ffffff" filter="url(#planetGlow)"/>
  <animateMotion dur="7.5s" repeatCount="indefinite" rotate="auto">
    <mpath href="#cometPath"/>
  </animateMotion>
  <animate attributeName="opacity" values="0;0.95;0.95;0;0" keyTimes="0;0.1;0.32;0.42;1" dur="7.5s" repeatCount="indefinite"/>
</g>

<!-- 3D Tilted Orbital Tracks -->
<g fill="none" stroke-width="1.2">
  <use href="#orbit1" stroke="#94a3b8" stroke-opacity="0.24"/>
  <use href="#orbit2" stroke="#6ee7b7" stroke-opacity="0.20"/>
  <use href="#orbit3" stroke="#60a5fa" stroke-opacity="0.24"/>
  <use href="#orbit4" stroke="#fb923c" stroke-opacity="0.20"/>
  <use href="#orbit5" stroke="#c084fc" stroke-opacity="0.22"/>
  <use href="#orbit6" stroke="#fbbf24" stroke-opacity="0.20"/>
</g>

<!-- 3D Central Sun with Pulsing Corona -->
<circle cx="600" cy="250" r="88" fill="url(#sunCorona)">
  <animate attributeName="r" values="84;96;84" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="600" cy="250" r="46" fill="url(#sun)" filter="url(#glow)"/>
<ellipse cx="584" cy="232" rx="16" ry="10" fill="#fffbe6" opacity="0.48" transform="rotate(-25 584 232)"/>

<!-- Planet 1: JAVA (3D metallic sphere) -->
<g>
  <circle cx="0" cy="0" r="12" fill="url(#pJava)" filter="url(#planetGlow)"/>
  <ellipse cx="-4" cy="-4" rx="3.5" ry="2" fill="#ffffff" opacity="0.55" transform="rotate(-30 -4 -4)"/>
  <text x="0" y="-19" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">JAVA</text>
  <animateMotion dur="11s" repeatCount="indefinite" begin="-2s">
    <mpath href="#orbit1"/>
  </animateMotion>
</g>

<!-- Planet 2: PYTHON (3D emerald world with atmospheric rim) -->
<g>
  <circle cx="0" cy="0" r="18" fill="#4ade80" opacity="0.18" filter="url(#planetGlow)"/>
  <circle cx="0" cy="0" r="16" fill="url(#pPython)"/>
  <path d="M-11 -3 Q0 -11 12 -2 M-9 7 Q2 2 10 6" stroke="#dcfce7" stroke-width="1.6" opacity="0.45" fill="none" stroke-linecap="round"/>
  <text x="0" y="-24" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#d1fae5" text-anchor="middle" letter-spacing="1">PYTHON</text>
  <animateMotion dur="16s" repeatCount="indefinite" begin="-7s">
    <mpath href="#orbit2"/>
  </animateMotion>
</g>

<!-- Planet 3: AI / LLMs (3D ocean/neural sphere + orbiting moon) -->
<g>
  <circle cx="0" cy="0" r="25" fill="#38bdf8" opacity="0.22" filter="url(#planetGlow)"/>
  <circle cx="0" cy="0" r="21" fill="url(#pAI)"/>
  <path d="M-15 -3 Q-3 -12 7 -4 T17 -2 M-12 9 Q-1 2 11 7" stroke="#bae6fd" stroke-width="2.2" opacity="0.55" fill="none" stroke-linecap="round"/>
  <!-- Orbiting Moon -->
  <g>
    <circle cx="31" cy="0" r="4" fill="#e0f2fe"/>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.8s" repeatCount="indefinite"/>
  </g>
  <text x="0" y="-29" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1">AI / LLMs</text>
  <animateMotion dur="22s" repeatCount="indefinite" begin="-13s">
    <mpath href="#orbit3"/>
  </animateMotion>
</g>

<!-- Planet 4: REACT (3D terracotta sphere) -->
<g>
  <circle cx="0" cy="0" r="15" fill="url(#pReact)" filter="url(#planetGlow)"/>
  <path d="M-9 -4 L7 3 M-6 4 L9 -5" stroke="#ffedd5" stroke-width="1.4" opacity="0.4" stroke-linecap="round"/>
  <text x="0" y="-23" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fed7aa" text-anchor="middle" letter-spacing="1">REACT</text>
  <animateMotion dur="28s" repeatCount="indefinite" begin="-4s">
    <mpath href="#orbit4"/>
  </animateMotion>
</g>

<!-- Planet 5: PROJECTS (3D ringed violet planet: back-ring -> sphere -> front-ring) -->
<g>
  <g transform="rotate(-16)">
    <!-- Back half of 3D ring -->
    <path d="M -46,0 A 46,12 0 0,1 46,0" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" opacity="0.55"/>
  </g>
  <circle cx="0" cy="0" r="27" fill="url(#pProjects)" filter="url(#planetGlow)"/>
  <ellipse cx="-9" cy="-9" rx="7" ry="4" fill="#ffffff" opacity="0.28" transform="rotate(-25 -9 -9)"/>
  <g transform="rotate(-16)">
    <!-- Front half of 3D ring -->
    <path d="M -46,0 A 46,12 0 0,0 46,0" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>
  </g>
  <text x="0" y="-36" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="1">PROJECTS</text>
  <animateMotion dur="36s" repeatCount="indefinite" begin="-21s">
    <mpath href="#orbit5"/>
  </animateMotion>
</g>

<!-- Planet 6: CLOUD (3D banded amber gas giant) -->
<g>
  <circle cx="0" cy="0" r="24" fill="url(#pCloud)" filter="url(#planetGlow)"/>
  <path d="M-21 -7 Q0 1 21 -7 M-22 5 Q0 13 22 5" stroke="#fef3c7" stroke-width="3.5" opacity="0.45" fill="none" stroke-linecap="round"/>
  <text x="0" y="-32" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="1">CLOUD</text>
  <animateMotion dur="44s" repeatCount="indefinite" begin="-10s">
    <mpath href="#orbit6"/>
  </animateMotion>
</g>

<!-- HUD Labels -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="34" y="38" fill="#9fb2c8" font-size="10" letter-spacing="2.2">PERSONAL DEVELOPER UNIVERSE</text>
  <rect x="425" y="454" width="350" height="46" rx="23" fill="#07111f" fill-opacity="0.72" stroke="#60a5fa" stroke-opacity="0.25"/>
  <text x="600" y="476" fill="#fff4d2" font-size="18" font-weight="700" letter-spacing="3" text-anchor="middle">SRI NAREN</text>
  <text x="600" y="492" fill="#9fb2c8" font-size="9.5" letter-spacing="2.4" text-anchor="middle">THE BUILDER AT THE CENTER</text>
  <text x="1166" y="488" fill="#9fb2c8" font-size="10" letter-spacing="2" text-anchor="end">SRI NAREN / 2026</text>
</g>
</svg>