<g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d7e6f5" text-anchor="middle">
 <text x="750" y="225">JAVA</text><text x="817" y="224">PYTHON</text><text x="365" y="218">AI / LLMs</text>
 <text x="930" y="225">REACT</text><text x="170" y="207">PROJECTS</text><text x="1060" y="216">CLOUD</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" fill="#9fb2c8" font-size="10" letter-spacing="2">
 <text x="34" y="38">PERSONAL DEVELOPER UNIVERSE</text><text x="1166" y="488" text-anchor="end">SRI NAREN / 2026</text>
</g>
</svg>