<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Sri Naren — Developer Solar System</title>
<desc id="desc">A dark space illustration with a glowing central sun, orbital paths and planets representing software engineering interests.</desc>
<defs>
  <radialGradient id="space"><stop stop-color="#10243a"/><stop offset=".58" stop-color="#07111f"/><stop offset="1" stop-color="#030711"/></radialGradient>
  <radialGradient id="sun"><stop stop-color="#fff7c2"/><stop offset=".32" stop-color="#ffd36e"/><stop offset=".68" stop-color="#ff8a3d"/><stop offset="1" stop-color="#d64b23"/></radialGradient>
  <radialGradient id="blue"><stop stop-color="#d5f6ff"/><stop offset=".38" stop-color="#54b8e8"/><stop offset="1" stop-color="#174c9c"/></radialGradient>
  <radialGradient id="green"><stop stop-color="#e6ffd7"/><stop offset=".4" stop-color="#69c77c"/><stop offset="1" stop-color="#1d684c"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#f1dcff"/><stop offset=".4" stop-color="#a17be7"/><stop offset="1" stop-color="#4c347e"/></radialGradient>
  <radialGradient id="red"><stop stop-color="#ffe0c8"/><stop offset=".4" stop-color="#e77d59"/><stop offset="1" stop-color="#7d302c"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="ring"><stop stop-color="#d5c4ff" stop-opacity=".05"/><stop offset=".5" stop-color="#d5c4ff" stop-opacity=".8"/><stop offset="1" stop-color="#d5c4ff" stop-opacity=".05"/></linearGradient>
</defs>
<rect width="1200" height="520" rx="24" fill="url(#space)"/>
<g fill="#fff">
 <circle cx="60" cy="75" r="1.5" opacity=".8"/><circle cx="130" cy="160" r="1" opacity=".6"/><circle cx="220" cy="48" r="1.3"/><circle cx="330" cy="115" r="1" opacity=".7"/>
 <circle cx="440" cy="42" r="1.4"/><circle cx="570" cy="92" r="1" opacity=".5"/><circle cx="690" cy="35" r="1.2"/><circle cx="810" cy="120" r="1.5"/>
 <circle cx="930" cy="55" r="1" opacity=".7"/><circle cx="1090" cy="110" r="1.5"/><circle cx="1140" cy="210" r="1" opacity=".7"/>
 <circle cx="90" cy="340" r="1.2"/><circle cx="190" cy="440" r="1"/><circle cx="340" cy="380" r="1.4"/><circle cx="480" cy="470" r="1"/>
 <circle cx="710" cy="430" r="1.4"/><circle cx="850" cy="480" r="1"/><circle cx="1020" cy="390" r="1.3"/><circle cx="1140" cy="450" r="1"/>
</g>
<g fill="none" stroke="#9bb9d8" stroke-opacity=".18" stroke-width="1.2">
 <ellipse cx="600" cy="265" rx="150" ry="80"/><ellipse cx="600" cy="265" rx="235" ry="126"/>
 <ellipse cx="600" cy="265" rx="330" ry="178"/><ellipse cx="600" cy="265" rx="435" ry="230"/>
 <ellipse cx="600" cy="265" rx="535" ry="280"/>
</g>
<circle cx="600" cy="265" r="68" fill="#ff9b42" opacity=".16" filter="url(#glow)"/>
<circle cx="600" cy="265" r="47" fill="url(#sun)" filter="url(#glow)"/>
<path d="M570 248c16-20 43-22 62-7-15-3-29 4-34 17-5 12-18 20-31 16-10-7-8-17 3-26z" fill="#fff2b0" opacity=".45"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <text x="600" y="365" fill="#fff4d2" font-size="24" font-weight="700" letter-spacing="3">SRI NAREN</text>
 <text x="600" y="389" fill="#a9bdd2" font-size="11" letter-spacing="3">THE BUILDER AT THE CENTER</text>
</g>
<!-- planets -->
<circle cx="750" cy="265" r="12" fill="#b9c2ce"/><circle cx="750" cy="261" r="4" fill="#eef3f7" opacity=".6"/>
<circle cx="817" cy="265" r="19" fill="url(#green)"/><path d="M803 260q14-10 29 0M806 273q10-6 22 0" stroke="#d9f8c8" opacity=".5" fill="none"/>
<circle cx="365" cy="265" r="24" fill="url(#blue)"/><path d="M346 262q13-9 23-2t18-1M352 276q10-8 19-3" fill="none" stroke="#d5ffd5" stroke-width="3" opacity=".65"/>
<circle cx="930" cy="265" r="16" fill="url(#red)"/><path d="M918 260l19 8m-15 2 18-12" stroke="#ffd3b5" opacity=".45"/>
<circle cx="170" cy="265" r="31" fill="url(#violet)"/><ellipse cx="170" cy="265" rx="48" ry="12" fill="none" stroke="url(#ring)" stroke-width="5" transform="rotate(-15 170 265)"/>
<circle cx="1060" cy="265" r="27" fill="#c7a16a"/><path d="M1037 256q23 9 46 0M1038 269q22 8 44 0" stroke="#f4d4a0" stroke-width="5" opacity=".65" fill="none"/>
